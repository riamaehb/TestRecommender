<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Test Recommender Prototype</title>
  <link rel="stylesheet" href="/static/style.css" />

  <!-- KaTeX CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

  <!-- Frontend JS -->
  <script defer src="/static/app.js"></script>
</head>
<body>
  <div class="container">
    <h1>Test Recommender</h1>
    <div id="meta"></div>

    <div id="consent" class="panel">
      <h2>Consent</h2>
      <p>Please read and consent to participate in this study.</p>
      <button id="consent-btn">I consent</button>
    </div>

    <div id="quiz-area" class="panel hidden">
      <div id="question-counter"></div>
      <div id="question-text"></div>
      <div id="choices"></div>
      <div class="nav">
        <button id="next-btn" disabled>Next</button>
        <button id="finish-btn">Finish Session</button>
      </div>
    </div>

    <div id="score-area" class="panel hidden">
      <h3>Qualification Score</h3>
      <div id="score"></div>
      <div id="qual-actions"></div>
    </div>

    <div id="survey-area" class="panel hidden">
      <h2>Post-study Survey</h2>
      <p>Rate your mental demand (1-5): 
        <input id="q_mental" type="number" min="1" max="5" value="3">
      </p>
      <p>Rate your frustration (1-5): 
        <input id="q_frustration" type="number" min="1" max="5" value="3">
      </p>
      <button id="survey-submit">Submit Survey</button>
    </div>

    <div id="completion" class="panel hidden">
      <h2>Completion Code</h2>
      <p id="completion-code"></p>
      <p>Return this code to Prolific to receive your reward.</p>
    </div>
  </div>
</body>
</html>
